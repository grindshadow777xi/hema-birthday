
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Hema Dede ♡</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Nunito:wght@600;700;800;900;1000&family=Playfair+Display:wght@600;700;800;900&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
 --pink:#e94e91;
 --rose:#b72d70;
 --plum:#713b72;
 --cream:#fff9f5;
}

html{scroll-behavior:smooth}

body{
 min-height:100vh;
 overflow-x:hidden;
 font-family:'Nunito',sans-serif;
 color:#34212f;
 background:linear-gradient(125deg,#ffe0ec,#fff0df,#f2dff8,#ffe4ed,#fff4e9);
 background-size:400% 400%;
 animation:sky 14s ease infinite;
 position:relative;
}

@keyframes sky{
 0%,100%{background-position:0% 50%}
 50%{background-position:100% 50%}
}

/* DREAMY LIGHTS */

.light{
 position:fixed;
 width:350px;
 height:350px;
 border-radius:50%;
 filter:blur(85px);
 opacity:.48;
 pointer-events:none;
 z-index:0;
 animation:drift 10s ease-in-out infinite alternate;
}

.light.a{background:#f28db9;top:-130px;left:-120px}
.light.b{background:#bba0ed;right:-130px;bottom:-120px;animation-delay:-4s}
.light.c{background:#ffd0a8;left:35%;top:40%;animation-delay:-7s}

@keyframes drift{
 to{transform:translate(70px,65px) scale(1.2)}
}

/* FLOATING BACKGROUND WORDS */

.hemo-layer{
 position:fixed;
 inset:0;
 z-index:1;
 overflow:hidden;
 pointer-events:none;
}

.floating-hemo{
 position:absolute;
 bottom:-100px;
 white-space:nowrap;
 font-family:'Playfair Display',serif;
 font-weight:900;
 color:#a83d75;
 opacity:0;
 text-shadow:0 0 7px #ffacd6,0 0 20px #e875b5;
 animation:hemoFloat linear infinite;
}

@keyframes hemoFloat{
 0%{transform:translateY(0) rotate(-12deg) scale(.7);opacity:0}
 15%{opacity:.32}
 80%{opacity:.3}
 100%{transform:translateY(-120vh) rotate(12deg) scale(1.2);opacity:0}
}

/* FLOATING HEARTS */

.float-heart{
 position:fixed;
 z-index:2;
 bottom:-60px;
 color:#e95d9d;
 pointer-events:none;
 animation:rise linear infinite;
 text-shadow:0 4px 14px #d64f9033;
}

@keyframes rise{
 0%{transform:translateY(0) rotate(-15deg) scale(.5);opacity:0}
 15%{opacity:.85}
 100%{transform:translateY(-115vh) rotate(35deg) scale(1.3);opacity:0}
}

/* SPARKLES */

.star{
 position:fixed;
 z-index:2;
 pointer-events:none;
 color:white;
 text-shadow:0 0 9px #c85b9b,0 0 18px white;
 animation:twinkle 2.4s ease-in-out infinite;
}

@keyframes twinkle{
 0%,100%{opacity:.2;transform:scale(.5) rotate(0)}
 50%{opacity:1;transform:scale(1.4) rotate(45deg)}
}

/* MAIN PAGE */

.page{
 min-height:100vh;
 padding:65px 18px 55px;
 display:flex;
 justify-content:center;
 align-items:center;
 position:relative;
 z-index:3;
}

.container{
 width:100%;
 max-width:900px;
 text-align:center;
}

/* JAR INTRO */

.jar-stage{
 min-height:calc(100vh - 120px);
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 transition:opacity .7s,transform .7s;
}

.jar-kicker{
 padding:9px 19px;
 border:1px solid #ffffffd9;
 border-radius:30px;
 background:#ffffff77;
 color:#793d70;
 letter-spacing:3px;
 font-size:10px;
 font-weight:1000;
 box-shadow:0 8px 25px #a94c7418;
 animation:kickerPulse 2.5s ease-in-out infinite;
}

@keyframes kickerPulse{
 0%,100%{transform:scale(1)}
 50%{transform:scale(1.06)}
}

.jar-heading{
 margin-top:25px;
 font-family:'Great Vibes',cursive;
 color:#87376f;
 font-size:clamp(43px,8vw,70px);
 text-shadow:0 5px 25px #c05a972b;
 animation:headingFloat 3s ease-in-out infinite;
}

@keyframes headingFloat{
 0%,100%{transform:translateY(0)}
 50%{transform:translateY(-9px)}
}

.jar-button{
 width:240px;
 height:290px;
 position:relative;
 margin:25px auto 15px;
 border:0;
 background:none;
 cursor:pointer;
 -webkit-tap-highlight-color:transparent;
 filter:drop-shadow(0 18px 20px #9e47782e);
 animation:jarDance 3s ease-in-out infinite;
}

@keyframes jarDance{
 0%,100%{transform:rotate(-3deg) translateY(0)}
 50%{transform:rotate(3deg) translateY(-13px)}
}

.jar-button:hover{
 animation:jarShake .45s ease-in-out infinite;
}

@keyframes jarShake{
 0%,100%{transform:rotate(-5deg)}
 25%{transform:rotate(5deg)}
 50%{transform:rotate(-5deg)}
 75%{transform:rotate(5deg)}
}

/* Jar cap */

.jar-lid{
 position:absolute;
 top:4px;
 left:50%;
 transform:translateX(-50%);
 width:142px;
 height:31px;
 border-radius:11px 11px 7px 7px;
 background:linear-gradient(180deg,#ffb4d3,#e95d9c,#c83c80);
 border:2px solid #fff2fa;
 box-shadow:0 7px 12px #a943752c;
 z-index:4;
 transition:transform 1s cubic-bezier(.2,.8,.3,1),opacity .8s;
}

.jar-lid:before{
 content:"";
 position:absolute;
 top:5px;
 left:8px;
 right:8px;
 height:5px;
 border-radius:10px;
 background:#ffffff85;
}

/* Jar neck */

.jar-neck{
 position:absolute;
 top:27px;
 left:50%;
 transform:translateX(-50%);
 width:125px;
 height:39px;
 border:3px solid #ffffffce;
 border-bottom:0;
 border-radius:10px 10px 0 0;
 background:linear-gradient(90deg,#ffffff30,#f5a9d555,#ffffff45);
}

/* Glass jar body */

.jar-body{
 position:absolute;
 top:57px;
 left:50%;
 transform:translateX(-50%);
 width:205px;
 height:198px;
 border-radius:35px 35px 48px 48px;
 border:3px solid #ffffffed;
 background:linear-gradient(120deg,#ffffffa0,#ffc7e07d,#ffffffb0);
 box-shadow:inset 8px 5px 20px #ffffffb8,
            inset -8px -8px 22px #e8a6ca40,
            0 14px 28px #9d477624;
 overflow:hidden;
 transition:transform 1s,opacity 1s;
}

.jar-shine{
 position:absolute;
 top:19px;
 left:17px;
 width:15px;
 height:125px;
 border-radius:20px;
 background:#ffffffae;
 filter:blur(2px);
 transform:rotate(5deg);
}

.jar-shine2{
 position:absolute;
 top:30px;
 right:16px;
 width:6px;
 height:76px;
 border-radius:20px;
 background:#ffffff85;
}

.jar-pookie{
 position:absolute;
 top:50%;
 left:50%;
 transform:translate(-50%,-50%);
 font-size:84px;
 filter:drop-shadow(0 5px 9px #bd548a35);
 animation:pookieBounce 1.7s ease-in-out infinite;
 transition:transform 1s,opacity .7s;
}

@keyframes pookieBounce{
 0%,100%{transform:translate(-50%,-50%) rotate(-7deg)}
 50%{transform:translate(-50%,-56%) rotate(7deg)}
}

.jar-mini-heart{
 position:absolute;
 font-size:23px;
 color:#e64c91;
 animation:miniHeart 2s ease-in-out infinite alternate;
}

.mh1{top:25px;left:36px}
.mh2{top:115px;right:25px;animation-delay:.6s}
.mh3{bottom:15px;left:40px;animation-delay:1s}

@keyframes miniHeart{
 from{transform:scale(.7) rotate(-15deg)}
 to{transform:scale(1.3) rotate(15deg)}
}

.jar-instruction{
 margin-top:8px;
 color:#79446c;
 font-size:14px;
 font-weight:900;
 letter-spacing:1px;
 animation:instructionPulse 1.5s ease-in-out infinite;
}

@keyframes instructionPulse{
 50%{opacity:.45;transform:scale(.96)}
}

/* OPEN JAR ANIMATION */

.jar-stage.opened .jar-button{
 animation:none;
}

.jar-stage.opened .jar-lid{
 transform:translate(85px,-145px) rotate(130deg);
 opacity:0;
}

.jar-stage.opened .jar-body{
 transform:translateX(-50%) scale(.65) rotate(-18deg);
 opacity:.15;
}

.jar-stage.opened .jar-pookie{
 transform:translate(-50%,-210%) scale(1.9) rotate(20deg);
 opacity:0;
}

.jar-stage.opened .jar-mini-heart{
 opacity:0;
}

.jar-stage.opened{
 transform:translateY(-30px);
}

/* BIG HEMA DEDE TEXT */

.reveal-area{
 margin:10px auto 0;
 display:none;
 opacity:0;
}

.reveal-area.show{
 display:block;
 animation:revealArea .8s ease forwards;
}

@keyframes revealArea{
 from{opacity:0;transform:translateY(60px) scale(.7)}
 to{opacity:1;transform:translateY(0) scale(1)}
}

.reveal-title{
 font-family:'Nunito',sans-serif;
 font-size:clamp(48px,11vw,100px);
 font-weight:1000;
 line-height:1.15;
 letter-spacing:1px;
 color:#c52f7d;
 text-shadow:0 5px 0 #ffbad8,0 10px 25px #a94c744d;
}

.reveal-title span{
 display:inline-block;
 opacity:0;
 animation:letterPop .7s cubic-bezier(.2,1.4,.5,1) forwards;
}

@keyframes letterPop{
 0%{opacity:0;transform:translateY(100px) rotate(-25deg) scale(.2)}
 70%{opacity:1;transform:translateY(-15px) rotate(8deg) scale(1.2)}
 100%{opacity:1;transform:translateY(0) rotate(0) scale(1)}
}

.title-heart{
 display:inline-block;
 color:#f34b96;
 font-size:.55em;
 animation:heartBeat 1s ease-in-out infinite;
 vertical-align:middle;
}

@keyframes heartBeat{
 0%,100%{transform:scale(1)}
 50%{transform:scale(1.35)}
}

/* BURST HEARTS */

.burst-heart{
 position:fixed;
 z-index:20;
 pointer-events:none;
 font-size:27px;
 animation:burst 1.5s ease-out forwards;
}

@keyframes burst{
 0%{transform:translate(0,0) scale(.2) rotate(0);opacity:1}
 100%{transform:translate(var(--x),var(--y)) scale(1.5) rotate(260deg);opacity:0}
}

/* PHOTO GALLERY */

.gallery{
 width:100%;
 margin:40px auto 0;
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:24px;
 opacity:0;
 transform:translateY(50px);
 pointer-events:none;
}

.gallery.visible{
 opacity:1;
 transform:translateY(0);
 pointer-events:auto;
}

.photo-card{
 position:relative;
 padding:10px;
 border-radius:24px;
 border:2px solid white;
 background:linear-gradient(145deg,#fff,#ffe7f1);
 box-shadow:0 16px 38px #99466e24;
 overflow:hidden;
 opacity:0;
 transform:translateY(70px) scale(.65) rotate(-10deg);
}

.gallery.visible .photo-card{
 animation:photoCrazy .9s cubic-bezier(.2,1.3,.5,1) forwards;
}

@keyframes photoCrazy{
 0%{opacity:0;transform:translateY(70px) scale(.65) rotate(-10deg)}
 60%{opacity:1;transform:translateY(-12px) scale(1.06) rotate(3deg)}
 100%{opacity:1;transform:translateY(0) scale(1) rotate(0)}
}

.photo-card img{
 width:100%;
 height:340px;
 display:block;
 object-fit:cover;
 border-radius:16px;
 transition:transform .7s cubic-bezier(.2,.8,.2,1),filter .7s;
}

.photo-card:hover img{
 transform:scale(1.09) rotate(1deg);
 filter:saturate(1.15);
}

.photo-card:before{
 content:"";
 position:absolute;
 z-index:2;
 top:-100%;
 left:-50%;
 width:40%;
 height:300%;
 transform:rotate(25deg);
 background:linear-gradient(90deg,transparent,#ffffff88,transparent);
 pointer-events:none;
}

.photo-card:hover:before{
 animation:shinePhoto 1s ease;
}

@keyframes shinePhoto{
 to{top:100%;left:130%}
}

/* First photo is larger */

.photo-card:first-child{
 grid-column:1 / -1;
 width:min(570px,100%);
 justify-self:center;
}

.photo-card:first-child img{
 height:460px;
}

/* Individual gallery entrance timings */

.gallery.visible .photo-card:nth-child(1){animation-delay:.1s}
.gallery.visible .photo-card:nth-child(2){animation-delay:.35s}
.gallery.visible .photo-card:nth-child(3){animation-delay:.6s}
.gallery.visible .photo-card:nth-child(4){animation-delay:.85s}
.gallery.visible .photo-card:nth-child(5){animation-delay:1.1s}
.gallery.visible .photo-card:nth-child(6){animation-delay:1.35s}
.gallery.visible .photo-card:nth-child(7){animation-delay:1.6s}

/* ENDING MESSAGE */

.ending{
 margin:80px auto 20px;
 padding:40px 25px;
 max-width:760px;
 border-radius:30px;
 border:1px solid #ffffffed;
 background:linear-gradient(145deg,#ffffffd9,#fff9f5b8);
 backdrop-filter:blur(20px);
 box-shadow:0 20px 60px #813f681c;
 opacity:0;
 transform:translateY(45px) scale(.9);
}

.ending.visible{
 animation:endingEnter 1.2s ease forwards;
}

@keyframes endingEnter{
 to{opacity:1;transform:translateY(0) scale(1)}
}

.ending-english{
 font-family:'Great Vibes',cursive;
 color:#a83d79;
 font-size:clamp(37px,7vw,58px);
 line-height:1.4;
 animation:endingFloat 3s ease-in-out infinite;
}

@keyframes endingFloat{
 0%,100%{transform:translateY(0)}
 50%{transform:translateY(-7px)}
}

.ending-kurdish{
 margin-top:19px;
 direction:rtl;
 font-family:'Noto Naskh Arabic',serif;
 font-size:clamp(21px,4vw,29px);
 font-weight:700;
 line-height:2;
 color:#713b72;
}

.ending-heart{
 margin-top:15px;
 font-size:30px;
 animation:heartBeat 1s ease-in-out infinite;
}

/* PAGE 4 NAVIGATION BUTTON */

.page4-link{
 display:inline-block;
 margin:25px auto 35px;
 padding:14px 25px;
 border-radius:30px;
 border:2px solid #fff;
 background:linear-gradient(135deg,#f7a5ca,#e76da8);
 color:white;
 text-decoration:none;
 font-family:'Noto Naskh Arabic','Nunito',sans-serif;
 font-size:18px;
 font-weight:800;
 box-shadow:0 8px 22px #b72d7040;
 transition:transform .3s,box-shadow .3s;
}

.page4-link:hover{
 transform:translateY(-5px) scale(1.04);
 box-shadow:0 13px 28px #b72d7055;
}

@media(max-width:600px){
 .page{padding:50px 13px 40px}
 .jar-button{transform:scale(.9)}
 .jar-stage{min-height:calc(100vh - 90px)}
 .gallery{gap:13px}
 .photo-card{padding:7px;border-radius:17px}
 .photo-card img{height:265px;border-radius:12px}
 .photo-card:first-child img{height:360px}
 .ending{padding:30px 17px}
}

@media(max-width:390px){
 .gallery{grid-template-columns:1fr}
 .photo-card:first-child{grid-column:1}
 .photo-card img{height:350px}
 .photo-card:first-child img{height:390px}
}
</style>
</head>

<body>

<div class="light a"></div>
<div class="light b"></div>
<div class="light c"></div>

<div class="hemo-layer" id="hemoLayer"></div>

<main class="page">
<div class="container">

    <!-- THE CUTE JAR -->

    <section class="jar-stage" id="jarStage">

        <div class="jar-kicker">A TINY SURPRISE FOR SOMEONE SPECIAL ♡</div>

        <h1 class="jar-heading">A little jar of happiness...</h1>

        <button class="jar-button" id="openJar" aria-label="Open the happiness jar">

            <div class="jar-lid"></div>
            <div class="jar-neck"></div>

            <div class="jar-body">

                <div class="jar-shine"></div>
                <div class="jar-shine2"></div>

                <span class="jar-pookie">🥺</span>

                <span class="jar-mini-heart mh1">♥</span>
                <span class="jar-mini-heart mh2">♡</span>
                <span class="jar-mini-heart mh3">♥</span>

            </div>

        </button>

        <div class="jar-instruction">
            TAP THE JAR, POOKIE! 🥺💗
        </div>

    </section>

    <!-- HEMA DEDE REVEAL -->

    <section class="reveal-area" id="revealArea">

        <h2 class="reveal-title" id="revealTitle"></h2>

        <span class="title-heart">♥</span>

    </section>

    <!-- PHOTO GALLERY -->

    <section class="gallery" id="gallery">

        <div class="photo-card">
            <img src="images/IMG_4512.jpg" alt="Hema Dede">
        </div>

        <div class="photo-card">
            <img src="images/IMG_4612.jpg" alt="Hema Dede">
        </div>

        <div class="photo-card">
            <img src="images/IMG_4605.jpg" alt="Hema Dede">
        </div>

        <div class="photo-card">
            <img src="images/IMG_8208.jpg" alt="Hema Dede">
        </div>

        <div class="photo-card">
            <img src="images/IMG_7643.jpg" alt="Hema Dede">
        </div>

        <div class="photo-card">
            <img src="images/IMG_7145.jpg" alt="Hema Dede">
        </div>

        <div class="photo-card">
            <img src="images/IMG_6861.jpg" alt="Hema Dede">
        </div>

    </section>

    <!-- FINAL WORDS -->

    <section class="ending" id="ending">

        <div class="ending-english">
            My Hema Dede, you are the best!<br>
            I'm so lucky to have you as my sister. ❤️
        </div>

        <div class="ending-kurdish" lang="ckb">
            هەما، تۆ لە هەمووان باشترینی! ❤️
        </div>

        <div class="ending-heart">💗 🥺 💗</div>

    </section>

    <!-- PAGE 4 BUTTON: ADDED -->

    <a href="page4.html" class="page4-link">
        ئەو ساتەی هەموومان چاوەڕێی بووین ♡
    </a>

</div>
</main>

<script>

const backgroundWords=[
 'HEMA','HEMO','HEMA DEDE','POOKIE','MY FAVOURITE',
 'LOTS OF LOVE','♡ HEMA ♡','SWEETEST DEDE','CUTIE','HEMO POOKIE',
 'MY DEAREST','HAPPY HEART','PINK LOVE','HEMOO','PRECIOUS DEDE'
];

for(let i=0;i<70;i++){
 const word=document.createElement('div');

 word.className='floating-hemo';
 word.textContent=backgroundWords[i%backgroundWords.length];

 word.style.left=Math.random()*100+'vw';
 word.style.fontSize=(15+Math.random()*29)+'px';

 word.style.animationDuration=(12+Math.random()*18)+'s';
 word.style.animationDelay=(-Math.random()*25)+'s';

 hemoLayer.appendChild(word);
}


// FLOATING HEARTS

for(let i=0;i<70;i++){

 const heart=document.createElement('div');

 heart.className='float-heart';
 heart.textContent=['♥','♡','💕','💗','💖','💘','🩷'][i%7];

 heart.style.left=Math.random()*100+'vw';
 heart.style.fontSize=(12+Math.random()*23)+'px';

 heart.style.animationDuration=(10+Math.random()*14)+'s';
 heart.style.animationDelay=(-Math.random()*22)+'s';

 document.body.appendChild(heart);
}


// SPARKLES

for(let i=0;i<55;i++){

 const star=document.createElement('div');

 star.className='star';
 star.textContent='✦';

 star.style.left=Math.random()*100+'vw';
 star.style.top=Math.random()*100+'vh';

 star.style.fontSize=(8+Math.random()*15)+'px';
 star.style.animationDelay=Math.random()*3+'s';

 document.body.appendChild(star);
}


// HEART BURST ANIMATION

function heartBurst(){

 const emojis=['💗','💕','💖','♥','✨','🥺','💘'];

 for(let i=0;i<55;i++){

   const heart=document.createElement('div');

   heart.className='burst-heart';
   heart.textContent=emojis[i%emojis.length];

   heart.style.left='50%';
   heart.style.top='45%';

   const angle=Math.random()*Math.PI*2;
   const distance=100+Math.random()*330;

   heart.style.setProperty('--x',Math.cos(angle)*distance+'px');
   heart.style.setProperty('--y',Math.sin(angle)*distance+'px');

   heart.style.animationDelay=Math.random()*.3+'s';

   document.body.appendChild(heart);

   setTimeout(()=>heart.remove(),1900);
 }
}


// HEMA DEDE LETTER ANIMATION

function createTitle(){

 const title=document.getElementById('revealTitle');
 const text='HEMA DEDE';

 [...text].forEach((letter,index)=>{

   const span=document.createElement('span');

   span.textContent=letter===' '?' ':letter;
   span.style.animationDelay=(index*.12)+'s';

   title.appendChild(span);
 });
}


// OPEN THE JAR

const jarStage=document.getElementById('jarStage');
const openJar=document.getElementById('openJar');
const revealArea=document.getElementById('revealArea');
const gallery=document.getElementById('gallery');
const ending=document.getElementById('ending');

let jarOpened=false;

openJar.addEventListener('click',()=>{

 if(jarOpened)return;

 jarOpened=true;

 // Jar opening animation
 jarStage.classList.add('opened');
 openJar.disabled=true;

 // Crazy heart explosion
 heartBurst();

 // Show HEMA DEDE
 setTimeout(()=>{

   createTitle();
   revealArea.classList.add('show');

 },650);

 // Reveal all photographs
 setTimeout(()=>{

   gallery.classList.add('visible');

 },1800);

 // Reveal the final English and Sorani message
 setTimeout(()=>{

   ending.classList.add('visible');

 },5600);

 // Remove the empty jar stage from the layout
 setTimeout(()=>{

   jarStage.style.display='none';

 },1800);

});

</script>

</body>
</html>
